<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items | Crafting Planner</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">Crafting Planner</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="items.html">Items</a>
        <a href="plan.html">Plan</a>
        <a href="swagger/index.html">API docs</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Items</h1>
    <p class="lead">Everything that can be crafted or used as an ingredient. Open an item to edit it or its recipe.</p>

    <div class="card">
      <h2>Add an item</h2>
      <form id="add-form" class="row">
        <label>Name
          <input id="add-name" required maxlength="80" placeholder="Copper Ore">
        </label>
        <label>Category
          <input id="add-category" maxlength="40" placeholder="Raw Material">
        </label>
        <label>Description
          <input id="add-description" maxlength="500" placeholder="Rock that contains copper." size="40">
        </label>
        <button class="btn" type="submit">Add</button>
      </form>
      <div id="add-notice" class="notice"></div>
    </div>

    <div class="card">
      <form id="filter-form" class="row">
        <label>Search
          <input id="search" maxlength="80" placeholder="name or description">
        </label>
        <label>Category
          <input id="category" maxlength="40" placeholder="any">
        </label>
        <label>Kind
          <select id="kind">
            <option value="">Any</option>
            <option value="raw">Raw</option>
            <option value="crafted">Crafted</option>
          </select>
        </label>
        <label>Sort by
          <select id="sort">
            <option value="name">Name</option>
            <option value="category">Category</option>
            <option value="id">Newest first</option>
          </select>
        </label>
        <button class="btn secondary" type="submit">Apply</button>
      </form>
      <div id="list-notice" class="notice"></div>
      <div id="list"></div>
      <div class="toolbar">
        <span id="page-info" class="muted"></span>
        <div class="actions">
          <button id="prev" class="btn secondary small" type="button">Previous</button>
          <button id="next" class="btn secondary small" type="button">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/items.js"></script>
</body>
</html>
