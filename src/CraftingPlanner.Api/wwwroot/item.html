<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item | Crafting Planner</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">Crafting Planner</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="items.html">Items</a>
        <a href="lists.html">Lists</a>
        <a href="plan.html">Plan</a>
        <a href="swagger/index.html">API docs</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div>
        <h1 id="title">Item</h1>
        <p class="lead" id="subtitle"></p>
      </div>
      <div class="actions">
        <a id="plan-link" class="btn" href="#">Plan this item</a>
        <button id="delete-item" class="btn danger" type="button">Delete item</button>
      </div>
    </div>

    <div id="page-notice" class="notice"></div>
    <datalist id="categories"></datalist>

    <div id="content" class="hidden">
      <div id="form" class="card"></div>

      <div class="grid">
        <div class="card">
          <h2>Used in</h2>
          <div id="used-in"></div>
        </div>
        <div class="card">
          <h2>On lists</h2>
          <div id="on-lists"></div>
        </div>
      </div>

      <div class="card" id="tree-card">
        <h2>Recipe tree</h2>
        <p class="muted">What this item is made from, down to the raw materials. Quantities are per single craft of the item above.</p>
        <div id="tree"></div>
      </div>
    </div>
  </main>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/item-form.js"></script>
  <script src="js/item.js"></script>
</body>
</html>
